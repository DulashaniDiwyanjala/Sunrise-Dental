<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunrise Dental Clinic — Appointment &amp; Patient Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ======================= TOAST ======================= -->
<div id="toastHost" class="toast-host" aria-live="polite"></div>

<!-- ======================= LOGIN SCREEN ======================= -->
<section id="loginScreen" class="login-screen">
  <div class="login-panel">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 64 64" width="52" height="52">
        <circle cx="32" cy="32" r="30" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M32 16c-6 0-10 4-10 10 0 8 3 11 3 18 0 3 2 5 4 5s3-2 3-6 1-6 3-6 3 2 3 6 1 6 3 6 4-2 4-5c0-7 3-10 3-18 0-6-4-10-10-10z" fill="currentColor"/>
        <line x1="32" y1="8" x2="32" y2="14" stroke="currentColor" stroke-width="2"/>
        <line x1="29" y1="11" x2="35" y2="11" stroke="currentColor" stroke-width="2"/>
      </svg>
    </div>
    <p class="eyebrow">Staff access · Colombo</p>
    <h1>Sunrise Dental Clinic</h1>
    <p class="login-sub">Appointment &amp; Patient Management System</p>

    <form id="loginForm" class="login-form" action="/Sunrise-Dental/login" method="POST">
      <div id="loginMessage" class="login-message" ></div>


      <label class="field">
        <span class="field-label">Username</span>
        <input type="text" id="loginUsername"  name="username" autocomplete="username" placeholder="e.g. reception" required>
      </label>
      <label class="field">
        <span class="field-label">Password</span>
        <input type="password" id="loginPassword"  name="password" autocomplete="current-password" placeholder="••••••••" required>
      </label>
      <button type="submit" class="btn btn-primary btn-block">Sign in</button>
    </form>

    
  </div>
</section>
<script>
  document.getElementById("loginForm").addEventListener("submit", function(e) {

    e.preventDefault();

    const username = document.getElementById("loginUsername").value;
    const password = document.getElementById("loginPassword").value;

    const message = document.getElementById("loginMessage");

    fetch("login", {
      method: "POST",
      headers: {
        "Content-Type": "application/x-www-form-urlencoded"
      },
      body: new URLSearchParams({
        username: username,
        password: password
      })
    })
            .then(response => response.json())
            .then(data => {

              if (data.success) {

                message.innerHTML =
                        '<div class="alert alert-success">Login Successful!</div>';

                setTimeout(function() {

                  if (data.role === "admin") {
                    window.location.href = "admin-dashboard.html";
                  } else {
                    window.location.href = "staff_dashboard.html";
                  }

                }, 1000);

              } else {

                message.className = "login-message error";
                message.innerHTML = "⚠ Invalid Username or Password";
              }

            })
            .catch(error => {

              console.error(error);

              message.innerHTML =
                      '<div class="alert alert-danger">Something went wrong. Please try again.</div>';
            });
  });
</script>
</body>
</html>
