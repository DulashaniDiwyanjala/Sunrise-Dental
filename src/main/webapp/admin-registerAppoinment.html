<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunrise Dental Clinic — Staff dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ======================= TOAST ======================= -->
<div id="toastHost" class="toast-host" aria-live="polite"></div>
<!-- ======================= APP SHELL ======================= -->
<div id="appShell" class="app-shell" >
  <aside class="sidebar">
    <div class="sidebar-brand">
      <svg viewBox="0 0 64 64" width="30" height="30" aria-hidden="true">
        <circle cx="32" cy="32" r="30" fill="none" stroke="currentColor" stroke-width="2.5"/>
        <path d="M32 16c-6 0-10 4-10 10 0 8 3 11 3 18 0 3 2 5 4 5s3-2 3-6 1-6 3-6 3 2 3 6 1 6 3 6 4-2 4-5c0-7 3-10 3-18 0-6-4-10-10-10z" fill="currentColor"/>
      </svg>
      <div>
        <strong>Sunrise Dental</strong>
        <span>Clinic Console</span>
      </div>
    </div>

    <nav class="sidebar-nav" id="sidebarNav">
      <button class="nav-item"><a href="admin-dashboard.html" class="nav-item active">Dashboard</a></button>
      <button class="nav-item"><a href="users.html" class="nav-item active">Add Users</a>
      </button>
      <button class="nav-item"><a href="admin-registerAppoinment.html" class="nav-item active">Register Appointments</a></button>
      <button class="nav-item" data-view="register"><a href="admin-dentist.html" class="nav-item active">Dentists</a>
      </button>
      <button class="nav-item" data-view="register"><a href="admin-treatment.html" class="nav-item active">Treatment</a>
      </button>
      <button class="nav-item" data-view="all"><a href="admin-appointments.html" class="nav-item active">Appointments</a>
      </button>

      <button class="nav-item" data-view="help"><a href="admin-help.html" class="nav-item active">Help</a>
      </button>
    </nav>

    <div class="sidebar-footer">
      <button id="exportBtn" class="btn btn-ghost btn-small btn-block">Export records (.txt)</button>
      <label class="btn btn-ghost btn-small btn-block file-import">
        Import records (.txt)
        <input type="file" id="importFile" accept=".txt,.csv" hidden>
      </label>
    </div>
  </aside>

  <div class="main-col">
    <header class="topbar">
      <div class="topbar-title" id="viewTitle">Dashboard</div>
      <div class="topbar-right">
        <span class="staff-chip">Signed in as <strong id="staffName">—</strong></span>
        <button id="exitBtn" class="btn btn-danger-outline btn-small">Exit System</button>
      </div>
    </header>
<!-- ---------- REGISTER ---------- -->
      <section class="view" id="view-register" >
        <div class="panel">
          <div class="panel-head">
            <h2>Register new appointment</h2>
            <span class="panel-sub">Next number: <span class="mono" id="nextApptNo">—</span></span>
          </div>
 
          <form id="registerForm" class="grid-form" action="/Sunrise-Dental/appoinment" method="post">
            <label class="field">
              <span class="field-label">Appoinment Number *</span>
              <input type="text"  placeholder="e.g. 01" name="appoinment_number">
              <span class="field-error" data-for="rPatientName"></span>
            </label>

            <label class="field">
              <span class="field-label">Patient full name *</span>
              <input type="text" id="rPatientName" placeholder="e.g. Kavindi Rathnayake" name="fullname">
              <span class="field-error" data-for="rPatientName"></span>
            </label>

            <label class="field field-wide">
              <span class="field-label">Address *</span>
              <input type="text" id="rAddress" placeholder="House no., street, city" name="address">
              <span class="field-error" data-for="rAddress"></span>
            </label>


            <label class="field">
              <span class="field-label">Contact number *</span>
              <input type="tel" id="rContact" placeholder="07X XXX XXXX" name="contact">
              <span class="field-error" data-for="rContact"></span>
            </label>


            <label class="field">
              <span class="field-label">Dentist *</span>

              <select name="dentist" id="dentistSelect" required>
                <option value="">Select Dentist</option>
              </select>
              <span class="field-error" data-for="dentistSelect"></span>
            </label>

            <label class="field">
              <span class="field-label">Treatment Type *</span>
              <select name="type" id="treatmentSelect" required>
                <option value="">Select Treatment</option>
              </select>
              <span class="field-error" data-for="treatmentSelect"></span>
            </label>
 
            <label class="field">
              <span class="field-label">Appointment date *</span>
              <input type="date" id="rDate" name="date">
              <span class="field-error" data-for="rDate"></span>
            </label>
 
            <label class="field">
              <span class="field-label">Appointment time *</span>
              <input type="time" id="rTime" step="1800" name="time">
              <span class="field-error" data-for="rTime"></span>
              <span class="field-hint">Clinic hours: Mon–Sat, 8:00 AM – 6:00 PM. Closed Sundays.</span>
            </label>
 
            <div class="form-actions field-wide">
              <button type="reset" class="btn btn-ghost">Clear form</button>
              <button type="submit" class="btn btn-primary">Register appointment</button>
            </div>
          </form>
        </div>
      </section>
</div>
</div>
    <script>
      document.addEventListener("DOMContentLoaded", function () {

        const dentistSelect =
                document.getElementById("dentistSelect");

        const treatmentSelect =
                document.getElementById("treatmentSelect");


        fetch("appoinment")
                .then(response => {

                  if (!response.ok) {
                    throw new Error("Failed to load data");
                  }

                  return response.json();
                })

                .then(data => {

                  // =========================
                  // LOAD DENTISTS
                  // =========================

                  dentistSelect.innerHTML =
                          '<option value="">Select Dentist</option>';

                  data.dentists.forEach(dentist => {

                    const option =
                            document.createElement("option");

                    option.value = dentist.id;
                    option.textContent = dentist.name;

                    dentistSelect.appendChild(option);
                  });


                  // =========================
                  // LOAD TREATMENTS
                  // =========================

                  treatmentSelect.innerHTML =
                          '<option value="">Select Treatment</option>';

                  data.treatments.forEach(treatment => {

                    const option =
                            document.createElement("option");

                    option.value = treatment.id;
                    option.textContent = treatment.name;

                    treatmentSelect.appendChild(option);
                  });

                })

                .catch(error => {

                  console.error(
                          "Error loading dentists/treatments:",
                          error
                  );

                  dentistSelect.innerHTML =
                          '<option value="">Failed to load dentists</option>';

                  treatmentSelect.innerHTML =
                          '<option value="">Failed to load treatments</option>';
                });

      });
    </script>
</body>
</html>
